[project]
name = "lumina-career-roi-prod"
version = "0.2.0"
description = "Labor market intelligence platform providing ROI metrics for technical skills"
readme = "README.md"
authors = [
    { name = "Gishgiish", email = "gishnora@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.61",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "polars>=1.43.1",
    "prefect>=3.8.1",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.9.7",
    "slowapi>=0.1.9",
    "tenacity>=9.0.0",
    "uvicorn>=0.52.0",
]

[project.scripts]
lumina-career-roi-prod = "lumina_career_roi_prod:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]